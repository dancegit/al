[pytest]
# Default selection: everything that needs neither a real toolchain run nor a real agent.
# A -m on the command line replaces this one (`-m slow`, `-m "slow and nix"`, `-m "not llm"` …).
addopts = -m "not slow and not llm" -p no:cacheprovider
testpaths = .
markers =
    slow: runs real codebase commands (minutes; toolchains and usually network needed)
    podman: needs rootless podman (skipped when the binary is missing)
    nix: needs nix (skipped when the binary is missing)
    network: needs network access (skipped when offline)
    llm: drives a real agent; never part of the default run
    browser: needs a headless Chromium already present (never downloaded)
