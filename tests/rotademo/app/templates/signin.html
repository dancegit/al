{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="subtitle">Demo sign-in: pick a user. There are no passwords; this only shows roles and organisations.</p>
<ul class="signin-list">
  {% for choice in choices %}
  <li>
    <form method="post" action="{{ url_for('signin_post') }}">
      <input type="hidden" name="user_id" value="{{ choice.id }}">
      <button id="signin-{{ choice.id }}" type="submit" class="signin-choice">
        <strong>{{ choice.name }}</strong>
        <span>{{ 'Ward manager' if choice.role == 'manager' else ('Agency nurse' if choice.employment == 'agency' else 'Worker') }} · {{ choice.org_name }}</span>
      </button>
    </form>
  </li>
  {% endfor %}
</ul>
{% endblock %}
